name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef27   # v5.0.7
        with:
          go-version: '1.22'

      - name: Lint
        run: |
          go vet ./...
          echo "go vet passed"

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output="seal_${{ matrix.target }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output="${output}.exe"
          fi
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${output}" ./cmd/seal
          sha256sum "${output}" > "${output}.sha256"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: seal_${{ matrix.target }}
          path: |
            seal_${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765   # v4.2.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SBOM
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name "*.sha256" -exec sha256sum {} \; > checksums.txt
          cat *.sha256 >> checksums.txt
          echo "" >> checksums.txt
          echo "Build provenance" >> checksums.txt
          echo "Repository: ${{ github.repository }}" >> checksums.txt
          echo "Workflow: ${{ github.workflow }}" >> checksums.txt
          echo "Run ID: ${{ github.run_id }}" >> checksums.txt
          echo "Commit: ${{ github.sha }}" >> checksums.txt
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
